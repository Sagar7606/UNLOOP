
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNLOOP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="brand">
        <div class="logo">
  <img src="brand-mark.svg" alt="UNLOOP" />
</div>
        <div>
          <h1>UNLOOP</h1>
          <p>Break Free from Recurring Payments</p>
        </div>
      </div>
      <span class="status-dot"></span>
    </header>

    <main>
      <section class="welcome">
        <p class="eyebrow">SUBSCRIPTION ASSISTANT</p>
        <h2>Manage your subscriptions.</h2>
        <p class="description">
          Keep track of recurring payments and avoid unwanted renewals.
        </p>
      </section>

      <section class="detection-card">
        <div class="card-heading">
          <span class="icon">◎</span>
          <span>Current website</span>
        </div>

        <h3 id="websiteName">Checking website...</h3>
        <p id="websiteStatus">Identifying the current tab</p>

        <button id="detectButton" class="secondary-button">
          Detect subscription
        </button>
      </section>

      <section class="subscription-card">
        <div class="card-heading">
          <span class="icon">＋</span>
          <span>Add subscription</span>
        </div>

        <form id="subscriptionForm">

          <!-- Account selection -->
          <label for="accountSelect">Save bookmark for</label>
          <select id="accountSelect" required>
            <option value="">Select account</option>
            <option value="user1">User 1</option>
            <option value="user2">User 2</option>
            <option value="user3">User 3</option>
            <option value="demo">Demo Login</option>
          </select>

          <label for="serviceName">Service / Plan name</label>
          <input
            type="text"
            id="serviceName"
            placeholder="e.g. Netflix Premium"
            required
          >

          <label for="price">Subscription price (₹)</label>
          <input
            type="number"
            id="price"
            placeholder="e.g. 649"
            min="0"
            step="0.01"
            required
          >

          <label for="billingCycle">Billing cycle</label>
          <select id="billingCycle" required>
            <option value="Monthly">Monthly</option>
            <option value="Yearly">Yearly</option>
            <option value="Weekly">Weekly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="One-time">One-time</option>
          </select>

          <label for="billingDate">Next billing date</label>
          <input
            type="date"
            id="billingDate"
            required
          >

          <button type="submit" class="primary-button">
            Add to UNLOOP
          </button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <span>UNLOOP Subscription Manager</span>
      <span>Demo Version 1.2</span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
